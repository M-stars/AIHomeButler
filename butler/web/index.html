<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Home Butler</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --text:#e6ecff; --dim:#8ea0c9; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#6ea8fe; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding:18px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; }
  .card h2 { font-size:15px; color:var(--accent); margin-bottom:10px; }
  #chatlog { height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:92%; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#2b4a8f; }
  .butler { align-self:flex-start; background:#232c44; }
  .tool { align-self:flex-start; color:var(--dim); font-size:12px; background:#1b2337; }
  .notif { border-left:3px solid var(--warn); padding:6px 10px; background:#221d10; border-radius:6px; margin-bottom:6px; font-size:13px; }
  .row { display:flex; gap:8px; }
  input[type=text] { flex:1; background:#0d1220; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px; }
  button { background:var(--accent); color:#0b1020; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; font-weight:600; }
  button.ghost { background:#232c44; color:var(--text); }
  button.danger { background:#7f1d1d; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  #confirmbar { display:none; background:#3a2b10; border:1px solid #7a5a1c; border-radius:10px; padding:12px; margin-bottom:14px; max-width:1200px; margin-left:auto; margin-right:auto; }
  .memitem, .taskitem { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; }
  .small { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<h1>🏠 AI Home Butler</h1>
<div class="sub" id="subline">正在连接…</div>
<div id="confirmbar">
  <b>⚠️ 操作确认请求</b>
  <div id="confirmbody"></div>
</div>

<div class="grid">
  <div>
    <div class="card">
      <h2>对话</h2>
      <div id="chatlog"></div>
      <div class="row">
        <input type="text" id="chatinput" placeholder="和管家说话，例如：现在客厅温度是多少？把客厅灯打开" />
        <button id="sendbtn">发送</button>
      </div>
      <div class="small" style="margin-top:6px">多步骤任务输入 <code>/task 任务描述</code>；控制设备会在这里弹出确认请求。</div>
    </div>
    <div class="card">
      <h2>主动提醒</h2>
      <div id="notiflist" class="small">加载中…</div>
    </div>
    <div class="card">
      <h2>语音设置（音色库）</h2>
      <div id="voicestatus" class="small">加载中…</div>
      <div class="small" style="margin:6px 0">
        <label><input type="checkbox" id="speakreply"> 朗读管家回复（使用当前默认音色，AI 合成语音）</label>
      </div>
      <div id="voicelist" style="margin:8px 0"></div>
      <div class="row" style="margin-bottom:6px">
        <input type="text" id="voicetesttext" placeholder="试听文本（默认：你好，卧室现在的温度是二十五度。）" />
      </div>
      <div class="row" style="margin-bottom:6px">
        <button id="voicepreset" class="ghost">添加官方示例音色</button>
        <button id="voicecacheclear" class="ghost">清空生成缓存</button>
      </div>
      <div class="small" style="margin-bottom:4px"><b>新建音色</b>（克隆需要说话人明确授权；仅支持 wav/mp3/flac/ogg/m4a，≤10MB，建议 5~15 秒）</div>
      <div class="row" style="margin-bottom:6px">
        <input type="text" id="voicename" placeholder="音色名称，如：我的声音" />
      </div>
      <div class="row" style="margin-bottom:6px">
        <input type="text" id="voicereftext" placeholder="参考录音中实际说出的文字" />
      </div>
      <div class="row" style="margin-bottom:6px">
        <input type="file" id="voicefile" accept=".wav,.mp3,.flac,.ogg,.m4a" style="flex:1;color:var(--dim)" />
      </div>
      <div class="row">
        <label class="small" style="display:flex;align-items:center;gap:4px">
          <input type="checkbox" id="voiceconsent"> 我是该录音的说话人 / 已获得说话人明确授权
        </label>
        <button id="voiceadd">创建音色</button>
      </div>
      <div class="small warn" style="margin-top:6px">⚠ 所有合成语音均为 AI 生成，请勿用于冒充真人或欺骗他人。</div>
      <div id="voicemsg" class="small"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>设备</h2>
      <table id="devicetable"><thead><tr><th>设备</th><th>状态</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <h2>长期记忆</h2>
      <div class="row" style="margin-bottom:8px">
        <input type="text" id="meminput" placeholder="手动添加一条记忆（视为用户陈述）" />
        <button id="memadd" class="ghost">添加</button>
      </div>
      <div id="memlist"></div>
    </div>
    <div class="card">
      <h2>任务记录</h2>
      <div id="tasklist" class="small">加载中…</div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  $("chatlog").appendChild(div);
  $("chatlog").scrollTop = $("chatlog").scrollHeight;
}

async function jfetch(url, options) {
  const resp = await fetch(url, options);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || resp.statusText);
  return data;
}

async function send() {
  if (busy) return;
  const input = $("chatinput");
  const text = input.value.trim();
  if (!text) return;
  busy = true; $("sendbtn").disabled = true;
  addMsg("user", text);
  input.value = "";
  const isTask = text.toLowerCase().startsWith("/task ");
  try {
    const data = await jfetch(isTask ? "/api/task" : "/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: isTask ? text.slice(6) : text}),
    });
    if (isTask) {
      addMsg("tool", `任务结果：${data.status}`);
      (data.steps || []).forEach(s => addMsg("tool", `${s.index}. ${s.tool} → ${s.status}：${s.message || ""}`));
      addMsg("butler", data.summary || "");
    } else {
      (data.tool_events || []).forEach(e => addMsg("tool", `[工具] ${e.tool}: ${e.status} — ${e.message}`));
      (data.notifications || []).forEach(n => addMsg("tool", `[主动提醒] ${n.message}`));
      addMsg("butler", data.reply || "（无回复）");
      if ($("speakreply").checked && data.reply) {
        jfetchAudio("/api/tts", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: data.reply}),
        }).then(playBlob).catch(err => addMsg("tool", "朗读失败：" + err.message));
      }
    }
  } catch (err) {
    addMsg("tool", "请求失败：" + err.message);
  } finally {
    busy = false; $("sendbtn").disabled = false;
    refresh();
  }
}

async function pollConfirmations() {
  try {
    const data = await jfetch("/api/confirmations");
    const list = data.confirmations || [];
    if (!list.length) { $("confirmbar").style.display = "none"; return; }
    $("confirmbar").style.display = "block";
    $("confirmbody").innerHTML = "";
    list.forEach(c => {
      const row = document.createElement("div");
      row.style.marginTop = "8px";
      const info = document.createElement("div");
      info.textContent = c.summary + "  " + JSON.stringify(c.arguments || {});
      const yes = document.createElement("button");
      yes.textContent = "批准"; yes.onclick = () => respond(c.id, true);
      const no = document.createElement("button");
      no.textContent = "拒绝"; no.className = "danger"; no.onclick = () => respond(c.id, false);
      row.append(info, yes, no);
      $("confirmbody").appendChild(row);
    });
  } catch (e) { /* 忽略轮询错误 */ }
}

async function respond(id, approved) {
  await jfetch("/api/confirmations/" + id, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({approved}),
  });
  pollConfirmations();
}

async function refreshDevices() {
  try {
    const data = await jfetch("/api/overview");
    $("subline").textContent = `模型 ${data.model} ｜ 设备后端 ${data.backend} ｜ 确认模式 ${data.confirmation_mode}`;
    const tbody = $("devicetable").querySelector("tbody");
    tbody.innerHTML = "";
    (data.devices || []).forEach(d => {
      const tr = document.createElement("tr");
      const stateText = d.available
        ? (d.state ? JSON.stringify(d.state) : "在线")
        : "离线";
      tr.innerHTML = `<td>${d.name}<div class="small">${d.id}</div></td>
        <td class="${d.available ? "ok" : "bad"}">${stateText}</td>`;
      tbody.appendChild(tr);
    });
  } catch (e) { /* 忽略 */ }
}

async function refreshMemories() {
  try {
    const data = await jfetch("/api/memories");
    const box = $("memlist");
    box.innerHTML = "";
    (data.memories || []).forEach(m => {
      const row = document.createElement("div");
      row.className = "memitem";
      const label = m.kind === "preference" ? "偏好" : "事实";
      const span = document.createElement("span");
      span.innerHTML = `<b class="small">[${label}]</b> ${m.content}`;
      const del = document.createElement("button");
      del.textContent = "删除"; del.className = "danger";
      del.onclick = async () => { await jfetch("/api/memories/" + m.id, {method: "DELETE"}); refreshMemories(); };
      row.append(span, del);
      box.appendChild(row);
    });
    if (!(data.memories || []).length) box.innerHTML = '<span class="small">暂无记忆</span>';
  } catch (e) { /* 忽略 */ }
}

async function refreshNotifications() {
  try {
    const data = await jfetch("/api/notifications");
    const box = $("notiflist");
    box.innerHTML = "";
    (data.notifications || []).slice(0, 8).forEach(n => {
      const div = document.createElement("div");
      div.className = "notif";
      div.textContent = `${n.created_at.slice(5, 16)} ${n.message}`;
      box.appendChild(div);
    });
    if (!(data.notifications || []).length) box.textContent = "暂无主动提醒。在对话里说“温度超过30度提醒我”即可创建规则。";
  } catch (e) { /* 忽略 */ }
}

async function refreshTasks() {
  try {
    const data = await jfetch("/api/tasks");
    const box = $("tasklist");
    box.innerHTML = "";
    (data.tasks || []).slice(0, 6).forEach(t => {
      const div = document.createElement("div");
      div.className = "taskitem";
      div.innerHTML = `<span>${t.user_text.slice(0, 26)}</span><span class="${t.outcome === "completed" ? "ok" : "warn"}">${t.outcome}</span>`;
      box.appendChild(div);
    });
    if (!(data.tasks || []).length) box.textContent = "暂无任务记录";
  } catch (e) { /* 忽略 */ }
}

// ---- 语音设置（音色库）----

function voiceMsg(text, isErr) {
  const box = $("voicemsg");
  box.textContent = text || "";
  box.className = "small " + (isErr ? "bad" : "ok");
}

async function jfetchAudio(url, options) {
  const resp = await fetch(url, options);
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    throw new Error(data.detail || resp.statusText);
  }
  return await resp.blob();
}

function playBlob(blob) {
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.play();
  audio.onended = () => URL.revokeObjectURL(url);
}

async function refreshVoiceStatus() {
  try {
    const s = await jfetch("/api/voice/status");
    const parts = [`TTS 后端 <b>${s.backend}</b>`];
    parts.push(s.backend === "cosyvoice"
      ? (s.cosyvoice_healthy ? '<span class="ok">CosyVoice 服务在线</span>' : '<span class="bad">CosyVoice 服务离线</span>')
      : "Windows SAPI 离线合成");
    if (s.default_voice) parts.push(`默认音色 <b>${s.default_voice.display_name}</b>`);
    if (s.last_degradation) parts.push(`<span class="warn">⚠ 已降级到 ${s.last_degradation.to}（${s.last_degradation.reason}）</span>`);
    $("voicestatus").innerHTML = parts.join(" ｜ ") + `<div class="small">${s.ai_disclaimer || ""}</div>`;
  } catch (e) {
    $("voicestatus").innerHTML = '<span class="bad">语音模块不可用：' + e.message + "</span>";
  }
}

async function refreshVoices() {
  try {
    const data = await jfetch("/api/voices");
    const box = $("voicelist");
    box.innerHTML = "";
    (data.voices || []).forEach(v => {
      const row = document.createElement("div");
      row.className = "memitem";
      const consentBadge = v.consent_status === "granted"
        ? '<span class="ok">已授权</span>' : '<span class="warn">未授权</span>';
      const defaultBadge = v.is_default ? '<span class="ok">[默认]</span>' : "";
      const active = data.active_voice_id === v.voice_id;
      const span = document.createElement("span");
      span.innerHTML = `<b>${v.display_name}</b> ${defaultBadge} ${consentBadge}
        <div class="small">${active ? "当前合成使用中 ｜ " : ""}参考文本长度 ${v.reference_text.length} 字</div>`;
      const btns = document.createElement("div");
      btns.style.display = "flex"; btns.style.gap = "6px";
      const mk = (label, cls, fn) => { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = fn; return b; };
      btns.append(
        mk("试听", "ghost", () => testVoice(v)),
        v.is_default ? document.createElement("span") : mk("设为默认", "ghost", async () => { await jfetch(`/api/voices/${v.voice_id}/default`, {method: "POST"}); refreshVoice(); voiceMsg(`已将「${v.display_name}」设为默认音色`); }),
        v.consent_status === "granted"
          ? mk("撤销授权", "ghost", async () => { await jfetch(`/api/voices/${v.voice_id}/consent`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({granted: false})}); refreshVoice(); })
          : mk("确认授权", "ghost", async () => { await jfetch(`/api/voices/${v.voice_id}/consent`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({granted: true})}); refreshVoice(); }),
        mk("删除", "danger", async () => {
          if (!confirm(`删除音色「${v.display_name}」？将同时删除其参考录音与生成缓存，不可恢复。`)) return;
          await jfetch("/api/voices/" + v.voice_id, {method: "DELETE"});
          refreshVoice(); voiceMsg(`已删除音色「${v.display_name}」`);
        })
      );
      row.append(span, btns);
      box.appendChild(row);
    });
    if (!(data.voices || []).length) box.innerHTML = '<span class="small">音色库为空。可添加官方示例音色，或上传参考录音创建个人音色。</span>';
  } catch (e) { /* 状态区已提示 */ }
}

async function testVoice(v) {
  const text = $("voicetesttext").value.trim() || "你好，卧室现在的温度是二十五度。";
  voiceMsg(`正在用「${v.display_name}」试听…`);
  try {
    const blob = await jfetchAudio(`/api/voices/${v.voice_id}/test`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    playBlob(blob);
    voiceMsg(`试听成功（${v.display_name}，AI 合成语音）`);
  } catch (e) {
    voiceMsg("试听失败：" + e.message, true);
  }
}

async function createVoice() {
  const name = $("voicename").value.trim();
  const refText = $("voicereftext").value.trim();
  const file = $("voicefile").files[0];
  if (!name || !refText || !file) { voiceMsg("请填写音色名称、参考录音文本并选择录音文件", true); return; }
  if (!$("voiceconsent").checked) { voiceMsg("克隆音色需要勾选授权确认（未授权的音色只能保存、不能合成）", true); return; }
  const form = new FormData();
  form.append("display_name", name);
  form.append("reference_text", refText);
  form.append("consent_granted", "true");
  form.append("prompt_wav", file);
  voiceMsg("正在创建音色…");
  try {
    const data = await jfetch("/api/voices", {method: "POST", body: form});
    $("voicename").value = ""; $("voicereftext").value = ""; $("voicefile").value = ""; $("voiceconsent").checked = false;
    refreshVoice();
    voiceMsg(`音色「${data.voice.display_name}」已创建，可直接试听`);
  } catch (e) {
    voiceMsg("创建失败：" + e.message, true);
  }
}

function refreshVoice() { refreshVoiceStatus(); refreshVoices(); }

function refresh() { refreshDevices(); refreshMemories(); refreshNotifications(); refreshTasks(); refreshVoiceStatus(); }

$("sendbtn").onclick = send;
$("chatinput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("voiceadd").onclick = createVoice;
$("voicepreset").onclick = async () => {
  try {
    await jfetch("/api/voices/preset", {method: "POST"});
    refreshVoice();
    voiceMsg("官方示例音色已加入音色库（可直接试听）");
  } catch (e) { voiceMsg("添加失败：" + e.message, true); }
};
$("voicecacheclear").onclick = async () => {
  try {
    const data = await jfetch("/api/voice/cache/clear", {method: "POST"});
    voiceMsg(`已清空 ${data.cleared} 个生成缓存文件`);
  } catch (e) { voiceMsg("清空失败：" + e.message, true); }
};
$("memadd").onclick = async () => {
  const content = $("meminput").value.trim();
  if (!content) return;
  await jfetch("/api/memories", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({kind: "preference", content})});
  $("meminput").value = "";
  refreshMemories();
};

refresh();
refreshVoices();
pollConfirmations();
setInterval(refresh, 8000);
setInterval(pollConfirmations, 2000);
</script>
</body>
</html>
